name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- tests/e2e
  linux-candidate:
    needs: verify
    # Only the trusted same-repository branch push publishes a candidate.
    if: github.event_name == 'push' && github.repository == 'dongrong-9527/team-workbench' && github.ref == 'refs/heads/feat/phase-1-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout delivery configuration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: ci-config
          persist-credentials: false
      - name: Checkout fixed application source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 443407ccf975a2285d5f70cbcc2fa2b0a41ecaab
          path: application-source
          persist-credentials: false
      - name: Build, audit, unpack and smoke candidate
        shell: bash
        run: bash ci-config/scripts/ci/package-linux.sh "$GITHUB_WORKSPACE/application-source" "$RUNNER_TEMP/linux-candidate"
      - name: Upload reviewed public candidate files
        id: candidate-upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-443407c-linux-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/linux-candidate/delivery/candidate.tar.gz
            ${{ runner.temp }}/linux-candidate/delivery/SHA256SUMS
            ${{ runner.temp }}/linux-candidate/delivery/release-manifest.json
            ${{ runner.temp }}/linux-candidate/delivery/verification.json
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - name: Prepare fresh artifact download directory
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.candidate-upload.outputs.artifact-id }}
        run: |
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          mkdir "$RUNNER_TEMP/candidate-roundtrip"
      - name: Download the artifact just uploaded in this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.candidate-upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/candidate-roundtrip
          digest-mismatch: error
      - name: Verify downloaded bytes and print public checksums
        shell: bash
        run: node ci-config/scripts/ci/artifact.mjs download "$RUNNER_TEMP/candidate-roundtrip" "$RUNNER_TEMP/linux-candidate/delivery"

# Include from nginx http context. Replace all EXAMPLE placeholders before use.
# Access logs omit query strings, cookies, credentials and bodies.
log_format workbench '$remote_addr $request_method $uri $status $request_time';
server {
    listen 80;
    server_name EXAMPLE_DOMAIN;
    return 308 https://EXAMPLE_DOMAIN$request_uri;
}
server {
    listen 443 ssl;
    server_name EXAMPLE_DOMAIN;
    ssl_certificate /etc/workbench/tls/EXAMPLE_CERT.pem;
    ssl_certificate_key /etc/workbench/tls/EXAMPLE_KEY.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/workbench/current/public;
    access_log /var/log/nginx/workbench-access.log workbench;
    error_log /var/log/nginx/workbench-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    client_max_body_size 6m;
    client_body_timeout 30s;
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        proxy_request_buffering on;
    }
    location = /health { return 404; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.html; }
}

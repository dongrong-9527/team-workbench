/var/log/nginx/workbench-*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    sharedscripts
    postrotate
        /bin/systemctl kill -s USR1 nginx.service >/dev/null 2>&1 || true
    endscript
}
# Configure journald disk limits through the operator's existing policy.
# Do not put credentials, request bodies or authentication headers in logs.
